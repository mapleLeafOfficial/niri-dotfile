# hyprlock — 锁屏（Super+L / Mod+L）
background {
    path = /home/guxing/.local/state/niri-wallpaper/current
    fit_mode = cover
    blur_passes = 1
    blur_size = 3
}

label {
    text = 󰣇 $USER
    font_size = 18
    font_family = JetBrainsMono Nerd Font Mono
    color = rgba(255, 255, 255, 0.7)
    position = 0, 240
    halign = center
    valign = center
}

label {
    text = $TIME
    font_size = 72
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.65)
    font_family = JetBrainsMono Nerd Font Mono
    color = rgba(255, 255, 255, 0.95)
    position = 0, 140
    halign = center
    valign = center
}

input-field {
    size = 320, 56
    outline_thickness = 2
    inner_color = rgba(20, 20, 28, 0.75)
    outer_color = rgba(170, 190, 230, 0.8)
    font_color = rgba(255, 255, 255, 0.95)
    dots_size = 0.3
    dots_center = true
    font_family = JetBrainsMono Nerd Font Mono
    placeholder_text = 󰌾  输入密码
    fail_text = 密码错误
    position = 0, -60
    halign = center
    valign = center
}
